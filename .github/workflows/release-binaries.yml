name: Release binaries
run-name: Release binaries of ${{ github.sha }}

# A release is named by a date, not by a version number: the date of the
# released commit in Japan Standard Time, written YYYY-MM-DD. The workflow
# reads the date from the head of main, so it takes no input, and the release
# creates the tag of that name when it is published.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  create-release:
    if: >-
      github.repository == 'Hihaheho/tauto' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release date
        id: release
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          tag=$(TZ=Asia/Tokyo git show --no-patch --format=%cd --date=format-local:%Y-%m-%d "$sha")
          if [[ ! "$tag" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Expected a release date of the form YYYY-MM-DD, got '$tag'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release or tag
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Create draft release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}

  build:
    needs: create-release
    if: >-
      github.repository == 'Hihaheho/tauto' &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_NAME: tauto-${{ needs.create-release.outputs.tag }}-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ needs.create-release.outputs.sha }}
          persist-credentials: false

      # The toolchain is the one pinned in rust-toolchain.toml.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      - name: Build
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET" \
            -p tauto-cli --bin tauto

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/$ARCHIVE_NAME"
          cp "target/$TARGET/release/tauto" "dist/$ARCHIVE_NAME/tauto"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "dist/$ARCHIVE_NAME/"
          cd dist
          tar -czf "$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"
          echo "ASSET=dist/$ARCHIVE_NAME.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=dist/$ARCHIVE_NAME.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = "dist/$env:ARCHIVE_NAME"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/tauto.exe" "$directory/tauto.exe"
          foreach ($file in @('LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE')) {
            Copy-Item $file "$directory/$file"
          }
          $archive = "$env:ARCHIVE_NAME.zip"
          Compress-Archive -Path $directory -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$archive.sha256" -Value "$hash  $archive`n" -Encoding ascii -NoNewline
          "ASSET=dist/$archive" >> $env:GITHUB_ENV
          "CHECKSUM=dist/$archive.sha256" >> $env:GITHUB_ENV

      - name: Verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/$env:ARCHIVE_NAME.zip" -DestinationPath "dist/verify"
          $extracted = "dist/verify/$env:ARCHIVE_NAME/tauto.exe"
          if (!(Test-Path -LiteralPath $extracted -PathType Leaf)) {
            throw "Missing expected archive entry: $env:ARCHIVE_NAME/tauto.exe"
          }
          $expectedHash = (Get-FileHash "target/$env:TARGET/release/tauto.exe" -Algorithm SHA256).Hash
          $actualHash = (Get-FileHash $extracted -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Archive content differs from built binary: tauto.exe"
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 1

  # The builds run without write access to the repository; this job alone
  # attaches what they made to the draft.
  upload:
    needs: [create-release, build]
    if: >-
      github.repository == 'Hihaheho/tauto' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        shell: bash
        run: |
          ls -l dist
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}

  # Publishing the draft creates the tag at the released commit.
  publish:
    needs: [create-release, upload]
    if: >-
      github.repository == 'Hihaheho/tauto' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish release
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
