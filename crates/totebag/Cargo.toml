[package]
name = "totebag"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Totebag: the totes a tote depends on, fetched from Git and fixed by content in Tauto.lock"

[dependencies]
# SHA-256 without a new dependency.
tauto-syntax = { path = "../tauto-syntax" }
eure-document = { workspace = true }
eure-reader = { workspace = true }
tauto-message = { path = "../tauto-message" }
tauto-rt = { path = "../tauto-rt" }

[dev-dependencies]
# Only to check that src/core.rs is what tauto-build makes of totes/totebag.
tauto-build = { path = "../tauto-build" }
tauto-messages = { path = "../tauto-messages" }
