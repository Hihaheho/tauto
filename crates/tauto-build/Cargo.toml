[package]
name = "tauto-build"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiles a tauto tote from the build.rs of a Rust crate"

[dependencies]
tauto = { path = "../tauto" }
tauto-message = { path = "../tauto-message" }
# Writes the messages in English from a build script. Left out only by
# tauto-messages-gen, which writes the code tauto-messages is built from.
tauto-messages = { path = "../tauto-messages", optional = true }
tauto-nir = { path = "../tauto-nir" }
tauto-rustgen = { path = "../tauto-rustgen" }
tauto-vm = { path = "../tauto-vm" }
quote = { workspace = true }

[features]
default = ["messages"]
messages = ["dep:tauto-messages"]

[dev-dependencies]
tauto-messages = { path = "../tauto-messages" }
serde_json = "1"
tauto-syntax = { path = "../tauto-syntax" }
