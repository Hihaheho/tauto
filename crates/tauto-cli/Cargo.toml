[package]
name = "tauto-cli"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The tauto command: run, check, fmt, lint, build"

[[bin]]
name = "tauto"
path = "src/main.rs"

[dependencies]
tauto-test-suite = { path = "../tauto-test-suite" }
tauto = { path = "../tauto" }
tauto-analyzer = { path = "../tauto-analyzer" }
tauto-nir = { path = "../tauto-nir" }
tauto-bind = { path = "../tauto-bind" }
tauto-build = { path = "../tauto-build" }
tauto-rustgen = { path = "../tauto-rustgen" }
serde_json = "1"
eure-document = { workspace = true }
eure-reader = { workspace = true }
serde = { version = "1", features = ["derive"] }
tauto-syntax = { path = "../tauto-syntax" }
tauto-jsgen = { path = "../tauto-jsgen" }
tauto-rt = { path = "../tauto-rt" }
tauto-vm = { path = "../tauto-vm" }
tauto-cli-totes = { path = "../tauto-cli-totes" }
totebag = { path = "../totebag" }
totebag-index = { path = "../totebag-index" }
tauto-message = { path = "../tauto-message" }
tauto-messages = { path = "../tauto-messages" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
