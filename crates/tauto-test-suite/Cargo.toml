[package]
name = "tauto-test-suite"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauto's case files: Eure documents under cases/ that say what the implementation answers for an input"

[dependencies]
eure-document = { workspace = true }
eure-reader = { workspace = true }
eure-schema = { workspace = true }
eure-fmt = { workspace = true }
tauto = { path = "../tauto" }
tauto-parol = { path = "../tauto-parol" }
tauto-nir = { path = "../tauto-nir" }
tauto-rustgen = { path = "../tauto-rustgen" }
tauto-messages = { path = "../tauto-messages" }

[[test]]
name = "cases"
harness = false

[[test]]
name = "backends"
harness = false

[[bench]]
name = "backend"
harness = false

[[bench]]
name = "vm"
harness = false

[dev-dependencies]
tauto-jsgen = { path = "../tauto-jsgen" }
tauto-vm = { path = "../tauto-vm" }
tauto-rt = { path = "../tauto-rt" }
serde_json = "1"

[[test]]
name = "fuzz"
harness = false
