[package]
name = "tauto-bind"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "tauto bind: tauto declarations for a Rust crate, from its rustdoc JSON"

[dependencies]
rustdoc-types = "0.61"
serde_json = "1"
eure-document = { workspace = true }
eure-reader = { workspace = true }
tauto-message = { path = "../tauto-message" }

[dev-dependencies]
tauto-messages = { path = "../tauto-messages" }
