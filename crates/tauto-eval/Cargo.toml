[package]
name = "tauto-eval"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Evaluation of Tauto programs with effects and step budgets."

[dependencies]
tauto-surface = { path = "../tauto-surface" }
tauto-nibcheck = { path = "../tauto-nibcheck" }
tauto-syntax = { path = "../tauto-syntax" }
tauto-rt = { path = "../tauto-rt" }
tauto-message = { path = "../tauto-message" }

# The HTTP client of `net` and the TLS of `tls_*` are native only; in
# WebAssembly they report that they are unavailable.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauto-rt = { path = "../tauto-rt", features = ["net", "tls"] }

[dev-dependencies]
tauto-messages = { path = "../tauto-messages" }
