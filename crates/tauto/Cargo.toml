[package]
name = "tauto"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauto: a minimal proof-oriented language with deep multi-shot effect handlers and a shared step budget"

[dependencies]
tauto-parse = { path = "../tauto-parse" }
tauto-kernel = { path = "../tauto-kernel" }
tauto-message = { path = "../tauto-message" }
tauto-workspace-hack = { path = "../tauto-workspace-hack" }
tauto-macro = { path = "../tauto-macro" }
tauto-macro-vm = { path = "../tauto-macro-vm" }
tauto-vm = { path = "../tauto-vm" }
tauto-nibcheck = { path = "../tauto-nibcheck" }
tauto-nir = { path = "../tauto-nir" }
tauto-surface = { path = "../tauto-surface" }
tauto-syntax = { path = "../tauto-syntax" }
tauto-parol = { path = "../tauto-parol" }
tauto-rt = { path = "../tauto-rt" }
totebag = { path = "../totebag" }
eure-document = { workspace = true }
eure-reader = { workspace = true }

# The HTTP client of `net` and the TLS of `tls_*` are native only; in
# WebAssembly they report that they are unavailable.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauto-rt = { path = "../tauto-rt", features = ["net", "tls"] }

[dev-dependencies]
tauto-case-inputs = { path = "../tauto-case-inputs" }
tauto-messages = { path = "../tauto-messages" }
