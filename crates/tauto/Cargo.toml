[package]
name = "tauto"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauto: a minimal proof-oriented language with deep multi-shot effect handlers and a shared step budget"

[dependencies]
tauto-kernel = { path = "../tauto-kernel" }
tauto-message = { path = "../tauto-message" }
tauto-macro = { path = "../tauto-macro" }
tauto-eval = { path = "../tauto-eval" }
tauto-nibcheck = { path = "../tauto-nibcheck" }
tauto-surface = { path = "../tauto-surface" }
tauto-syntax = { path = "../tauto-syntax" }
tauto-parol = { path = "../tauto-parol" }
tauto-rt = { path = "../tauto-rt" }
totebag = { path = "../totebag" }
eure-document = { workspace = true }
eure-reader = { workspace = true }

[dev-dependencies]
tauto-messages = { path = "../tauto-messages" }
