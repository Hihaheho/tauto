[package]
name = "tauto-analyzer-wasm"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "tauto-analyzer compiled to WebAssembly: goals, try, fill and suggest for an editor in a browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tauto = { path = "../tauto" }
tauto-analyzer = { path = "../tauto-analyzer" }
tauto-messages = { path = "../tauto-messages" }

# The seed of the hash maps under query-flow (src/rand.rs), in WebAssembly only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "=0.3.4"
