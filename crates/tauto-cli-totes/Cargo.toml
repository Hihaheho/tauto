[package]
name = "tauto-cli-totes"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The totes the tauto command runs (the bytecode machine and the table generator), compiled to Rust when the command is built"

# Each tote is compiled by a crate of its own: Cargo runs their build scripts
# side by side and runs again only the one whose tote changed.
[dependencies]
tauto-rt = { path = "../tauto-rt" }
fmtcmd-bridge = { path = "../../totes/fmtcmd/bridge" }
tauto-cli-tote-vm = { path = "../tauto-cli-tote-vm" }
tauto-cli-tote-syntaxgen = { path = "../tauto-cli-tote-syntaxgen" }
tauto-cli-tote-snippet = { path = "../tauto-cli-tote-snippet" }
tauto-cli-tote-lsp = { path = "../tauto-cli-tote-lsp" }
tauto-cli-tote-fmtcmd = { path = "../tauto-cli-tote-fmtcmd" }
tauto-cli-tote-initcmd = { path = "../tauto-cli-tote-initcmd" }
tauto-cli-tote-doc = { path = "../tauto-cli-tote-doc" }
