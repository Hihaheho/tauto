[package]
name = "tauto-rustgen"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauto's Rust generator: NIR to the source of a Cargo workspace"

[dependencies]
tauto-syntax = { path = "../tauto-syntax" }
tauto = { path = "../tauto" }
tauto-nir = { path = "../tauto-nir" }
tauto-parol = { path = "../tauto-parol" }
tauto-message = { path = "../tauto-message" }
tauto-cache = { path = "../tauto-cache" }
proc-macro2 = { workspace = true }
quote = { workspace = true }

[dev-dependencies]
tauto-jsgen = { path = "../tauto-jsgen" }
tauto-messages = { path = "../tauto-messages" }
