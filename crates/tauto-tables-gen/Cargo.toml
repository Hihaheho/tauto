[package]
name = "tauto-tables-gen"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Writes the generated table files of the totes (the syntax tables of totes/syntax) and checks them"

# A member of the root workspace, so that scripts/generate-syntax-tables.taut
# reuses the compiler crates `cargo build -p tauto-cli` already built instead
# of building the whole self-hosting harness in a target directory of its own.
[dependencies]
tauto = { path = "../tauto" }
tauto-parol = { path = "../tauto-parol" }
