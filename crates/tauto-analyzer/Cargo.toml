[package]
name = "tauto-analyzer"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauto for editors: an incremental checker on query-flow, navigation, assists and syntax-literal completion"

[dependencies]
tauto = { path = "../tauto" }
tauto-identity = { path = "../tauto-identity" }
tauto-parol = { path = "../tauto-parol" }
tauto-syntax = { path = "../tauto-syntax" }
tauto-message = { path = "../tauto-message" }
tauto-rt = { path = "../tauto-rt" }
query-flow = { workspace = true }

[build-dependencies]
tauto-build = { path = "../tauto-build" }

[dev-dependencies]
tauto-messages = { path = "../tauto-messages" }
