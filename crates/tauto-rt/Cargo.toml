[package]
name = "tauto-rt"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The run-time library of Rust code generated from tauto: handlers, the O and M tiers, budgets"

[features]
sync = []
# `net` of the standard effects (`std/prelude/Os.taut`): an HTTP client.
net = ["dep:reqwest", "dep:url"]
# The reactor (`src/reactor.rs`): many tasks on each of a few threads.
reactor = ["sync", "dep:tokio"]
# TLS over byte streams the program holds, terminated by rustls.
tls = ["dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["blocking", "rustls"] }
url = { version = "=2.5.8", optional = true }
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", optional = true }

# The system's secure random source; a bare wasm32-unknown-unknown has none.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "=0.3.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "=1.53.3", optional = true, default-features = false, features = ["rt", "time", "sync"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
