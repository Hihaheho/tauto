[package]
name = "tauto-syntax"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The tables of a tauto syntax and the scanner and LL(k) parser that run them"

# No dependencies: the driver reads tables that totes/llkgen made
