[package]
name = "tauto-cli-tote-vm"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "The tote totes/vm compiled to Rust, for the tauto command (through tauto-cli-totes)"

[dependencies]
tauto-rt = { path = "../tauto-rt" }
vm-bridge = { path = "../../totes/vm/bridge", features = ["jit"] }


[build-dependencies]
tauto-build = { path = "../tauto-build" }
