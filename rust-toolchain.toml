# A nightly Cargo, so the publish-age cooldown in .cargo/config.toml is
# enforced; stable Cargo before it ships ignores those keys. Pinned by date
# (about 14 days old when chosen) so every machine and CI build the same way;
# keep the workflows' dtolnay/rust-toolchain `toolchain:` equal to this.
[toolchain]
channel = "nightly-2026-10-06"
components = ["rustfmt", "clippy"]
