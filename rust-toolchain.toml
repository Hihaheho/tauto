# A nightly Cargo, so the publish-age cooldown in .cargo/config.toml is
# enforced; stable Cargo ignores those keys. Pinned by date so every machine
# and CI build the same way; a CI job that installs its toolchain itself
# installs this channel.
[toolchain]
channel = "nightly-2026-10-06"
components = ["rustfmt", "clippy"]
