[package]
name = "vm-bridge"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "What the machine of totes/vm asks of Rust: native code for some of the program's functions"

# Without `jit` the bridge has no native code and depends on nothing: the
# machine a test builds on its own uses it that way.
[features]
jit = ["dep:tauto-jit", "dep:tauto-nir"]

[dependencies]
tauto-jit = { path = "../../../crates/tauto-jit", optional = true }
tauto-nir = { path = "../../../crates/tauto-nir", optional = true }
