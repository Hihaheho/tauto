# Supply-chain cooldown: refuse crate versions published less than 14 days ago
# when resolving (cargo update / add / a new lockfile entry). Honored by the
# Cargo pinned in rust-toolchain.toml; older Cargo ignores these keys.
[registry]
global-min-publish-age = "14 days"

[resolver]
incompatible-publish-age = "deny"

# The next trait solver for coherence only: it type checks the generated parser
# tables far more slowly.
[build]
rustflags = ["-Znext-solver=coherence"]
