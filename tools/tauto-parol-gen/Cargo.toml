# Regenerates the Tauto parser from crates/tauto-parol/tauto.par. Its own
# workspace on purpose: parol and its dependencies run only when the grammar
# changes and never enter the root Cargo.lock or any build.
[package]
name = "tauto-parol-gen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates crates/tauto-parol/src/generated from tauto.par"
license = "MIT OR Apache-2.0"

[dependencies]
parol = "=5.0.2"

[workspace]
