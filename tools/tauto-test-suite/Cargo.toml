[package]
name = "tauto-test-suite"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauto's case files: Eure documents under cases/ that say what the implementation answers for an input"

[dependencies]
tauto-nibcheck = { path = "../../crates/tauto-nibcheck" }
serde_json = "1"
eure-document = { workspace = true }
eure-reader = { workspace = true }
eure-schema = { workspace = true }
eure-fmt = { workspace = true }
tauto = { path = "../../crates/tauto" }
tauto-analyzer = { path = "../../crates/tauto-analyzer" }
tauto-parol = { path = "../../crates/tauto-parol" }
tauto-nir = { path = "../../crates/tauto-nir" }
tauto-message = { path = "../../crates/tauto-message" }
tauto-messages = { path = "../../crates/tauto-messages" }
tauto-rt = { path = "../../crates/tauto-rt" }

[[test]]
name = "cases"
harness = false

[[test]]
name = "backends"
harness = false

[[test]]
name = "nir_text"
harness = false

[[test]]
name = "nir_blocks"
harness = false

[[test]]
name = "nir_blocks_text"
harness = false

[[bench]]
name = "backend"
harness = false

[[bench]]
name = "vm"
harness = false

[dev-dependencies]
tauto-rustgen = { path = "../../crates/tauto-rustgen" }
tauto-jsgen = { path = "../../crates/tauto-jsgen" }
tauto-vm = { path = "../../crates/tauto-vm" }
tauto-niri = { path = "../../crates/tauto-niri" }

[[test]]
name = "fuzz"
harness = false
