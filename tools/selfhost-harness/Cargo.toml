[package]
name = "selfhost-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hihaheho/tauto"
description = "Build, run and verify the Tauto implementations of compiler components against their Rust counterparts"

[dependencies]
eure-document = { git = "https://github.com/Hihaheho/eure", rev = "5b7afb885604f12e4713265c1b9e19681b2bc00b" }
eure-reader = { git = "https://github.com/Hihaheho/eure", rev = "5b7afb885604f12e4713265c1b9e19681b2bc00b" }
tauto = { path = "../../crates/tauto" }
tauto-kernel = { path = "../../crates/tauto-kernel", features = ["selfhost"] }
regex-syntax = "=0.8.11"
tauto-syntax = { path = "../../crates/tauto-syntax" }
tauto-parol = { path = "../../crates/tauto-parol" }
tauto-nir = { path = "../../crates/tauto-nir" }
tauto-jsgen = { path = "../../crates/tauto-jsgen" }
tauto-test-suite = { path = "../tauto-test-suite" }
serde_json = "1"

[dev-dependencies]

[[bench]]
name = "compiler"
harness = false

# Its own workspace: the differential tests build the totes with
# `tauto build --release`, which takes long, so `cargo test --workspace` at the
# root does not run them. Run them with
# `cargo test --locked --manifest-path tools/selfhost-harness/Cargo.toml`.
[workspace]

# The differential tests run the totes on the Rust backend; only
# tests/evaluator.rs runs a few under the evaluator, which runs much faster
# optimized.
[profile.test.package.tauto]
opt-level = 3

[profile.test.package.tauto-syntax]
opt-level = 3
